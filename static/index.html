<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fertigungs-Betriebssystem</title>
<link rel="stylesheet" href="/static/styles.css?v=4">
</head>
<body>
<header class="topbar">
  <h1>⚙ Fertigungs-OS <span style="font-size:.7rem;opacity:.6;font-weight:400">Build 6</span></h1>
  <nav id="nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="offers">Angebote</button>
    <button data-view="pipeline">Pipeline</button>
    <button data-view="followups">Follow-up</button>
    <button data-view="crm">CRM</button>
    <button data-view="projects">Projekte</button>
    <button data-view="production">Produktion</button>
    <button data-view="documents">Dokumente</button>
    <button data-view="copilot">Copilot</button>
  </nav>
  <button id="btn-new" class="primary">+ Neue Anfrage</button>
</header>

<main id="main"></main>

<!-- Dialog: Neue Anfrage -->
<dialog id="dlg-new">
  <h2>Neue Kundenanfrage</h2>
  <p class="muted">E-Mail, RFQ-Text oder Freitext einfügen — und/oder Dateien anhängen
  (PDF, Bilder, TXT/CSV).</p>
  <input id="new-email" type="email" placeholder="Kunden-E-Mail (optional)">
  <textarea id="new-text" rows="10" placeholder="Anfrage hier einfügen…"></textarea>
  <input id="new-files" type="file" multiple
         accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv,.md">
  <div class="actions">
    <button id="btn-analyze" class="primary">Mit KI analysieren</button>
    <button id="btn-cancel">Abbrechen</button>
  </div>
  <p id="new-status" class="muted"></p>
</dialog>

<script src="/static/main.js"></script>
</body>
</html>
